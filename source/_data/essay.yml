- title: "闲言碎语"
  subTitle: "这里记录一些日常学习、折腾和阶段性想法"
  tips: "随手记点过程，方便自己回看"
  buttonLink: "/"
  buttonText: "首页"
  limit: 30
  top_background: https://s41.ax1x.com/2026/04/07/peUwbQA.jpg
  essay_list:
    - content: "最近在看区块链跨域认证相关的内容，主要还是先把几篇基础论文和现有方案理清。现在最大的感受是，很多概念单独看都不算难，但一旦放到完整系统里，就必须把身份、信任传递和认证流程一起想明白。"
      date: 2026-04-04 18:00:00
      from: "MacBook Air"
      address: "实验室"
    - content: "研一还没正式开学，但这段时间已经在提前补网络安全方向的基础。因为本科是计算机科学与技术，直接切到更明确的研究方向后，很多内容需要重新按研究视角再学一遍，和本科阶段只会做题、只会写代码还是不太一样。"
      date: 2025-06-01 21:30:00
      from: "Ipad Air 5"
      address: "宿舍"
    - content: "复试结束之后，心态明显比初试阶段松了一些，但也不敢完全停下来。现在回头看，复试准备时间虽然不长，但把 C++ 里类、构造析构、继承多态这些常考点反复过了几遍，确实很值。"
      date: 2025-04-02 03:15:00
      from: "MacBook Air"
      address: "自习室"
    - content: "初试出分之后，真正的压力不是“能不能进复试”，而是“复试这段时间怎么分配”。那段时间基本就是一边准备面试自我介绍，一边补 C++ 笔试，节奏很赶，但也逼着自己把很多以前拖着没系统整理的内容补了一遍。"
      date: 2025-03-31 14:00:00
      from: "Windows 笔记本"
      address: "宿舍"
    - content: "考完初试之后那段时间反而有点不适应。前面几个月每天都围着政治、英语、数学和专业课转，突然停下来之后会有一种惯性还在的感觉。现在回头看，那段高强度复习虽然累，但也算是把自己的执行力逼出来了一次。"
      date: 2025-03-28 10:20:00
      from: "MacBook Air"
      address: "家里"
    - content: "2024 年下半年基本就是按考研节奏在走。真正难的不是某一门课，而是每天都要稳定推进。很多时候一天学下来并没有特别明显的成就感，只能靠复盘任务完成情况来判断自己有没有偏离进度。"
      date: 2024-10-12 22:10:00
      from: "Windows 笔记本"
      address: "图书馆"
    - content: "确定考东南网安之后，复习方向就比之前清楚了很多。本科是计算机科学与技术，所以基础课还算有延续性，但一旦目标具体下来，专业课和院校信息都得自己重新梳理，不能只停留在模糊准备。"
      date: 2024-06-18 20:30:00
      from: "Windows 笔记本"
      address: "宿舍"
    - content: "大三之后明显感觉到，单纯把课上完和真正把知识学会是两回事。数据结构、操作系统、计算机网络这些课，平时考试过了不代表真的会用，后面准备考研的时候又重新学了一遍，很多地方才算第一次真正看明白。"
      date: 2023-11-05 19:00:00
      from: "教务系统"
      address: "教学楼"
    - content: "从机械转到计算机科学与技术之后，最直接的变化就是每天接触的内容完全不一样了。刚开始补 C 语言和程序设计基础的时候压力不小，因为很多同学已经有先修基础了，但也正是从那时候开始，我慢慢确定自己还是更适合计算机这条路。"
      date: 2022-09-14 16:40:00
      from: "校园网"
      address: "机房"
    - content: "大一刚入学时学的是机械专业，当时对专业本身没有特别强的认同感，更多是先按部就班把课程上完。后来接触到计算机相关内容之后，才慢慢意识到自己更愿意做逻辑性更强、反馈更直接的事情，这也成了后面转专业的起点。"
      date: 2021-09-20 09:10:00
      from: "新生报到系统"
      address: "本科校园"
